<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Check-out</title>
</head>
<body class="productPage-body">
    <header class="right-slide">
        <nav>
            <ul class="header-style-1">
                <!-- <li class="logo"> -->
                
                    <img src="./assets/logo/placeholder logo.png" alt="placeholder logo" class="logo-image">

                    <li class="categories-container">
                        <div class="nav-and-icon">                    
                            <a href="#Categories" class="categories-link">
                                <img class="categories-icon" src="/assets/icon/categories.png" alt="">
                                <span class="categories-text">Categories</span>
                            </a>
                            <img src="assets/icon/down-arrow.png" alt="down-arrow" class="down-arrow">
                            <img src="assets/icon/up-arrow.png" alt="up-arrow" class="up-arrow">   
                        </div>
                        <ul class="drop-menu"></ul> 
                    </li>    
                                
                <div class="left-aligned-nav">       
                    <li>
                        <a href="index.html#home">Home</a>
                    </li>          
                    <li class="all-products-container">
                        <a href="index.html#All-products">All Products</a>
                    </li>
                                    
                    <li><a href="index.html#About">About</a></li>
                    <!-- <li><a href="#Testimonials">Testimonials</a></li> -->
                </div>

                 <div class="right-aligned-nav">
                    
                    <div class="contact-buttons">                
                        <a class="whatsapp-contact-button" aria-label="Chat on WhatsApp" href="https://wa.me/254701973009"> 
                            <img class="whatsapp-icon" alt="Chat on WhatsApp" src="/assets/icon/whatsapp.png"/>
                        </a>
                        <a href="tel:+254792929806">
                            <img class="phone-icon" src="/assets/icon/phone.png" alt="phone-icon">
                        </a>                        
                    </div>

                    <li class="cart-container">                        
                        <span class="cart-items-display"></span><img src="assets/icon/shopping-cart png.png" alt="cart icon" class="cart-icon">
                        <p>Cart</p>
                    </li>

                    <img class="menu-icon" src="./assets/icon/menu icon.png" alt="menu-icon">
                </div>

            </ul>
        </nav>
    </header>
    
    <main>
        <h1 class="productPage-h1">PRODUCT</h1>

        <section class="productPage">                       
        
            <div class="productPage-order"> 
                <section class="order">   
                    <h3>Order</h3>       
                    <button class="nav-and-icon cart-btn">
                        <img src="assets/icon/shopping-cart png.png" alt="cart-icon" class="cart-icon">
                        <div class="cart-cta-link"><a href="#Add To Cart">Add To Cart</a></div>
                    </button>
                    
                    <button class="click-to-pay">Click to Pay</button>
                    
                    <p><b>OR</b></p>
                    
                    <button class="nav-and-icon order-by-whatsapp">
                        <img src="assets/icon/whatsapp.png" alt="whatsapp-icon" class="whatsapp-icon">
                        <a class="whatsapp-cta-link">Order on WhatsApp</a>                 
                    </button>

                    <div>
                        <a href="/index.html" class="add-more-items">Add more items</a>
                    </div>
                </section>
            </div>

            <div class="productPage-info">         
                <h3 class="productPage-product-name"></h3>
                <div class="productPage-image"></div>            
                <p class="productPage-price"></p>
                <p class="productPage-product-description"></p>
            </div> 
        </section>
    </main>

     <footer>
        
        <div class="upper-footer">        
            <img src="./assets/logo/Sylvan Logistics logo -black bg.png" alt="placeholder logo" class="logo-image">
            
            <section class="contact">
                <h2 id="Contact">Contact Us</h2>
                <div class="contact-buttons">                
                    <a aria-label="Chat on WhatsApp" href="https://wa.me/254701973009"> 
                        <img class="whatsapp-contact-button" alt="Chat on WhatsApp" src="/assets/other images/ChatOnWhatsapp.png"/>
                    </a>
                    <a href="tel:+254792929806" class="call-us-link">Click to Call Us</a>
                </div>
                <p class="phone-number"><b>Phone</b>: +254 792929806</p>
                <p class="email"><b>Email</b>: Sylvanlogistics254@gmail.com</p>
            </section>

            <section class="footer-product-categories">
                <h2>Products</h2>
                <ul class="footer-categories"></ul>
            </section>
        </div>

        <div class="lower-footer">
            <p class="copyright-info">&copy <span id="copyright-year">2026</span><span id="copyright-name"> Sylvan Logistics</span></p>
        </div>
    </footer>

    <script src="/index.js" type="module"></script>        
</body>
</html>
